name: Release

# Builds and tests pushed tags, then attaches the Figma plugin and an
# installable MCP tarball to a GitHub Release. Nothing is published to npm.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release + asset upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Release steps talk to GitHub via the API tokens below, never git push.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Gate before uploading release assets. `pnpm build` also builds the
      # plugin (dist/code.js + dist/index.html) packaged as an asset below.
      - run: pnpm build
      - run: pnpm test

      # The tarball includes dist and package metadata; npm installs its runtime
      # dependencies locally. Use the tag in asset names even for manually
      # created tags whose package.json version has not been bumped.
      - name: Package the MCP server
        run: |
          mkdir -p "$RUNNER_TEMP/mcp"
          pnpm -C packages/mcp pack --pack-destination "$RUNNER_TEMP/mcp"
          mv "$RUNNER_TEMP"/mcp/figwright-mcp-*.tgz "$RUNNER_TEMP/figwright-mcp-${GITHUB_REF_NAME}.tgz"

      - name: Package the Figma plugin
        working-directory: packages/plugin
        run: |
          zip -r "$RUNNER_TEMP/figwright-plugin-${GITHUB_REF_NAME}.zip" manifest.json dist

      # GitHub-generated notes use the tag, independently of the npm package
      # version. Reuse an existing release so failed uploads can be retried.
      - name: Create release & upload assets
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/figwright-plugin-${GITHUB_REF_NAME}.zip" \
            "$RUNNER_TEMP/figwright-mcp-${GITHUB_REF_NAME}.tgz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
